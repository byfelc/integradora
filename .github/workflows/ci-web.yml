# =====================================================================
#  CI Web — PWA React (Vite)
#  Etapas: detectar cambios → npm ci (con caché) → oxlint → pruebas unitarias (Vitest)
#          → build de producción → verificación de service worker y manifest
#  Artefacto: web-dist (paquete compilado que se despliega sin recompilar)
# =====================================================================
name: CI Web

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: web-changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'infra/scripts/web/**'
              - '.github/workflows/ci-web.yml'

  verify:
    name: web-verify
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar + oxlint + pruebas unitarias
        run: ./infra/scripts/web/test.sh
      - name: Build de producción + verificación de PWA
        run: ./infra/scripts/web/build.sh
      - name: Publicar paquete compilado
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: ${{ github.ref_name == 'main' && 90 || 14 }}
          if-no-files-found: error
