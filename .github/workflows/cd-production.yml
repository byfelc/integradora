# =====================================================================
#  CD Production — Despliegue a producción con APROBACIÓN MANUAL
#  Lo lanza release.yml (o una persona desde Actions > Run workflow).
#  Aprobación: el job "approval" abre un issue y espera a que Regina (Scrum
#  Master) o Arturo (Product Owner) comenten "aprobar" (o "rechazar").
#  Se usa un issue porque en repositorios PRIVADOS GitHub solo ofrece
#  "required reviewers" en el plan Enterprise; este mecanismo funciona en todos.
#  Si el repo se vuelve público, puede sustituirse por revisores del ambiente.
#  Despliega exactamente los artefactos de la versión, sin recompilar:
#    imagen :vX.Y.Z  ·  paquete PWA del Release  ·  migraciones de ese tag
# =====================================================================
name: CD Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a desplegar (tag existente, ej. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  approval:
    name: approval-production
    runs-on: ubuntu-latest
    timeout-minutes: 1440          # espera hasta 24 h la respuesta
    permissions:
      issues: write
    steps:
      - name: Esperar aprobación de Regina o Arturo
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.PROD_APPROVERS }}        # ej. "Sidas200,usuario-regina"
          minimum-approvals: 1
          issue-title: "Desplegar ${{ inputs.version }} a producción"
          issue-body: |
            Revisa la versión en el ambiente de pruebas y las notas del Release ${{ inputs.version }}.
            Comenta **aprobar** para desplegar o **rechazar** para cancelar.
          additional-approved-words: 'aprobar, aprobado'
          additional-denied-words: 'rechazar, rechazado'

  deploy:
    name: deploy-production
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar formato de versión
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "✘ Versión inválida: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Migrar base de datos de producción (Flyway)
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./infra/scripts/db/migrate.sh
      - name: Desplegar backend (imagen de la versión)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: ./infra/scripts/deploy/render-deploy.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tdimp-backend:$VERSION"
      - name: Prueba de humo del backend
        run: ./infra/scripts/deploy/smoke-test.sh "${{ vars.API_URL }}" 420
      - name: Descargar paquete PWA del Release
        run: |
          gh release download "$VERSION" --pattern "tdimp-pwa-$VERSION.zip" --dir release
          unzip -q "release/tdimp-pwa-$VERSION.zip" -d dist
      - name: Configurar URL de la API de producción (sin recompilar)
        run: ./infra/scripts/web/set-runtime-config.sh dist "${{ vars.API_URL }}"
      - name: Publicar PWA en Netlify (sitio de producción)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx -y netlify-cli@17 deploy --dir=dist --prod --message "release $VERSION"
      - name: Resumen
        run: |
          {
            echo "## ✔ $VERSION en producción"
            echo "- API: ${{ vars.API_URL }}"
            echo "- PWA: ${{ vars.WEB_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
