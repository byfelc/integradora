# =====================================================================
#  Release — Publicación de una versión (versionado semántico)
#  Se dispara al empujar un tag vMAYOR.MENOR.PARCHE sobre main:
#      git switch main && git pull && git tag v1.0.0 && git push origin v1.0.0
#  1. Verifica que el tag apunte a un commit de main.
#  2. Promueve la imagen del backend :main → :v1.0.0 (sin reconstruir).
#  3. Reúne el último artefacto exitoso de main de cada módulo (PWA, APK, juego).
#  4. Crea el GitHub Release con notas generadas desde los commits.
#  5. Lanza cd-production.yml, que espera la aprobación de Regina o Arturo.
# =====================================================================
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write      # crear el release
  packages: write      # etiquetar la imagen
  actions: write       # descargar artefactos y lanzar cd-production

jobs:
  release:
    name: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El tag debe estar sobre main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "✘ $VERSION no apunta a un commit de main; las versiones solo salen de main." >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promover imagen del backend (:main → :${{ env.VERSION }})
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tdimp-backend"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:main"
          echo "### Imagen: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Reunir artefactos de cada módulo
        env:
          PROD_API_URL: ${{ vars.API_BASE_URL_PROD }}
          TELEMETRY_API_KEY_PROD: ${{ secrets.TELEMETRY_API_KEY_PROD }}
        run: ./infra/scripts/release/collect-artifacts.sh "$VERSION"
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: The Day I Made That Promise ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/release/*.zip
      - name: Lanzar despliegue a producción (espera aprobación)
        # Los eventos creados con GITHUB_TOKEN no disparan otros workflows,
        # excepto workflow_dispatch; por eso se lanza explícitamente.
        run: gh workflow run cd-production.yml --ref "$VERSION" -f version="$VERSION"
