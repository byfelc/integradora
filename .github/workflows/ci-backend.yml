# =====================================================================
#  CI Backend — Spring Boot + PostgreSQL + contrato OpenAPI
#  Etapas: detectar cambios → contrato → checkstyle + unitarias + integración
#          (Testcontainers) + cobertura → imagen Docker (solo en push)
#  Artefactos: reporte-backend (pruebas y cobertura), imagen ghcr.io/<owner>/tdimp-backend:<sha>
# =====================================================================
name: CI Backend

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: backend-changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/contracts/**'
              - 'infra/scripts/backend/**'
              - '.github/workflows/ci-backend.yml'
            contract:
              - 'shared/contracts/**'
              - 'infra/scripts/contract/**'

  contract:
    name: backend-contract
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.contract == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato y detectar cambios incompatibles
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          ./infra/scripts/contract/check.sh "$BASE"

  verify:
    name: backend-verify
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Checkstyle + pruebas unitarias + integración + cobertura
        run: ./infra/scripts/backend/test.sh
      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore
      - name: Resumen de cobertura
        if: success()
        run: |
          CSV=backend/target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de líneas del backend: %.1f %%\n", 100*c/(m+c)}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    name: backend-image
    needs: [changes, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la imagen (en minúsculas, como exige GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tdimp-backend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen (una sola vez por commit)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resumen
        run: echo "### Imagen publicada - \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
