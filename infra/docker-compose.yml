# Entorno local reproducible: PostgreSQL + backend.
# Uso (desde infra/):   cp .env.example .env && docker compose up --build
# La web corre aparte con `npm run dev` en web/ (http://localhost:5173).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tdimp}
      POSTGRES_USER: ${POSTGRES_USER:-tdimp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tdimp}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tdimp}"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tdimp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tdimp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tdimp}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-dev-telemetry-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]

volumes:
  pgdata:
