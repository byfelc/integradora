spring:
  application:
    name: tdimp-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tdimp}
    username: ${SPRING_DATASOURCE_USERNAME:tdimp}
    password: ${SPRING_DATASOURCE_PASSWORD:tdimp}
  jpa:
    hibernate:
      ddl-auto: validate      # el esquema lo controla Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

telemetry:
  api-key: ${TELEMETRY_API_KEY:dev-telemetry-key}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
